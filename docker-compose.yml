services:
  postgres:
    image: postgres:16
    container_name: district-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: district_intelligence
      POSTGRES_USER: district_user
      POSTGRES_PASSWORD: district_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
